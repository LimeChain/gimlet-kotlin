# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.limechain.gimlet
pluginName = Gimlet
pluginRepositoryUrl = https://github.com/LimeChain/gimlet-kotlin
# SemVer format -> https://semver.org
pluginVersion = 0.1.6

# Target IDE is RustRover. Build number ranges -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# Minimum is RustRover 2026.2's build number - the compile/sandbox
# target and the oldest release covered by verification. Older IDE
# lines stay on the last plugin version whose range matched them
# (2026.1.x -> 0.1.6); Marketplace routes that automatically.
pluginSinceBuild = 262.8665

# No upper bound: the until-build attribute is omitted (see
# `untilBuild = provider { null }` in rustrover/build.gradle.kts), so
# every future IDE build (2026.2, 2027.x, ...) is accepted. Breakages
# in new majors are caught by `verifyPlugin` instead of a hard cap;
# reintroduce a `pluginUntilBuild` pin only if a major ships a known
# incompatibility.

# RustRover build to download for the build sandbox (./gradlew runIde / buildPlugin).
# This is the oldest supported compile/sandbox target - keep equal to
# pluginSinceBuild's release. Newer IDE generations are covered by
# Plugin Verifier; the `kotlin` pin in gradle/libs.versions.toml must
# match this build's bundled stdlib (2026.2 bundles Kotlin 2.4.0) and
# moves in lockstep.
platformVersion = 2026.2

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# RustRover bundles every plugin we need directly - no marketplace deps.
# `com.intellij.nativeDebug` carries the `cidr.debugger` module
# (LLDB driver, XDebugSession integration) and `com.jetbrains.rust`
# is the same JetBrains Rust plugin that ships separately on other IDEs.
platformBundledPlugins = com.intellij.nativeDebug,com.jetbrains.rust

# Marketplace dependencies (separately distributed plugins, pinned per
# build for reproducibility). Empty today - everything we need is in
# `platformBundledPlugins` above.
platformPlugins =

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.4.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
