# Gimlet plugin message bundle. All user-visible strings in the plugin
# are keyed here and accessed via GimletBundle.message("...").
#
# Conventions:
#   * Group keys by feature area (plugin.*, settings.*, action.*, error.*,
#     notification.*).
#   * Use dot-separated lower-camel-case keys.
#   * Use {0}, {1}, ... for MessageFormat placeholders.
#
# Additional locales live alongside this file as GimletBundle_<lang>.properties
# (e.g. GimletBundle_de.properties). The DynamicBundle base class handles
# fallback to this default when a key is missing from a localised file.

plugin.name=Gimlet
notification.group.title=Gimlet

# Settings page (Settings → Tools → Gimlet)
settings.title=Gimlet
settings.tcpPort=TCP port:
settings.tcpPort.comment=Port the SBPF VM's gdbstub listens on. Must match SBF_DEBUG_PORT passed to cargo test.
settings.platformToolsVersion=Platform-tools version:
settings.platformToolsVersion.comment=Solana platform-tools release under ~/.cache/solana/v[version]/. Must match the version you built the program against (cargo-build-sbf --tools-version v[version]).
settings.stopOnEntry=Stop on program entry
settings.stopOnEntry.comment=When checked, each attached session pauses at the SBPF program's entry point. Uncheck to continue straight to the first breakpoint.
settings.platformToolsPath=Platform-tools path:
settings.platformToolsPath.comment=Optional. Absolute path to a platform-tools install root. Overrides the ~/.cache/solana/v[version]/platform-tools/ default. Useful for CI or custom toolchain locations.
settings.sbfTracePath=SBF trace path:
settings.sbfTracePath.comment=Optional. Absolute or project-relative path to the SBPF trace directory containing program_ids.map. Defaults to target/sbf/trace/.
settings.artifactsPath=Artifacts path:
settings.artifactsPath.comment=Optional. Absolute or project-relative path to the directory holding built .so + .so.debug companions. Defaults to target/deploy/debug/.

# Settings validation messages
settings.error.platformToolsVersion.required=Platform-tools version is required
settings.error.platformToolsVersion.format=Use major.minor format (e.g. 1.54)
settings.error.platformToolsVersion.tooOld=Version {0} is below the minimum supported {1}
settings.error.platformToolsPath.invalid=Not a valid filesystem path
settings.error.platformToolsPath.notAbsolute=Must be an absolute path
settings.error.path.invalid=Not a valid filesystem path
